# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: pre-release

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: 1.18
    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [mipsle]
        os: [linux]
        # arch: [amd64, 386, arm, arm64]
        # os: [windows, linux, darwin]
        # include:
        #   - ext: .exe
        #     os: windows
        # exclude:
        #   - os: darwin
        #     arch: 386
        #   - os: darwin
        #     arch: arm
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - name: Set up Go
      uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
      with:
        go-version: 1.18
    - name: Build ${{ matrix.os }} ${{ matrix.arch }}
      run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} GOMIPS=softfloat go build -o bin/smartmeter-bridge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} -v ./... || true
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: bin/*

  pre-release:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
    - name: Download a Build Artifact
      uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
    - name: Automatic prerelease
      uses: marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0 # v1.2.1
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: "latest"
        prerelease: true
        title: Development build
        files: |
          artifact/*


